[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microcalcification-hybrid-framework"
version = "1.0.0"
description = "Reproducibility implementation of the hybrid wavelet–EfficientNetV2/CBAM–ViT–interval type-2 fuzzy–Fuzzy ART framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","scikit-image>=0.22","PyWavelets>=1.5","opencv-python>=4.8","Pillow>=10.0","pydicom>=2.4","torch>=2.1","torchvision>=0.16","timm>=0.9.16","PyYAML>=6.0","tqdm>=4.66","matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/vahidMCSD/An-Interpretable-Hybrid-Deep-Learning-and-Interval-Type-2-Fuzzy-Framework"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
reviewer = ["pytest>=8.0", "shap>=0.45", "grad-cam>=1.5"]
